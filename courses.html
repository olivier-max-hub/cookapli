<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cookapli">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="application-name" content="Cookapli">
<title>Liste de courses · Cookapli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Economica:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Cookapli · Liste de courses. Design system « Mes recettes » : cadre bleu canard, rayons en pastel, cartes blanches. */
:root{
  --bg:#eef8fb;--wash1:#f1fafc;--wash2:#e6f6f7;--wash3:#eaf5fb;
  --card:#ffffff;--veil:rgba(255,255,255,.8);
  --ink:#1f2a24;--mute:#000;--line:#d3e6ea;
  --acc:#0f6b78;--acc-deep:#0b4f59;--acc-pale:#e3f6f8;--on:#ffffff;--on-soft:rgba(255,255,255,.88);
  --ok:#9fd89a;--ok-pale:#cdeccb;--warn:#ffd9c7;
  --sh-card:0 2px 8px rgba(0,0,0,.1);--sh-header:0 2px 10px rgba(0,0,0,.15);
  --font:Economica,"Arial Narrow",Arial,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{font-size:112.5%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
/* Petits textes : noirs et en gras (Economica fin est trop pâle en petit) */
small,.hint,.note,.sub,.meta{font-weight:700}

body{
  margin:0;color:var(--ink);font:1rem/1.45 var(--font);min-height:100vh;
  background:linear-gradient(160deg,var(--wash1),var(--wash2) 55%,var(--wash3)) fixed,var(--bg);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--acc);z-index:10}
.wrap{max-width:760px;margin:0 auto}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
:where(a,button,input,summary):focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--acc);color:var(--on);box-shadow:var(--sh-header);padding-block:10px 0}
.hdr .top{display:flex;align-items:center;gap:12px}
.reset{flex:none;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:.95rem;padding:6px 12px;border-radius:99px;cursor:pointer}
.reset:focus-visible{outline-color:#fff}
@media (max-width:420px){.hdr h1{font-size:1.5rem}.reset{padding:5px 10px;font-size:.9rem}}
.back{color:var(--on);text-decoration:none;font-size:1.5rem;line-height:1;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.12);flex:none}
.back:focus-visible,.tabs a:focus-visible{outline-color:var(--on)}
.hdr h1{margin:0;font-size:1.8rem;line-height:1.05}
.hdr p{margin:0;color:var(--on-soft);font-size:.9rem}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:none;color:var(--on);text-decoration:none;padding:8px 12px 9px;border-radius:14px 14px 0 0;font-weight:700;opacity:.85}
.tabs a[aria-current="page"]{background:var(--wash1);color:var(--acc-deep);opacity:1}
.tabs .n{display:inline-block;min-width:1.4em;padding:0 6px;margin-left:4px;border-radius:99px;background:rgba(255,255,255,.2);font-size:.8rem;text-align:center}
.tabs a[aria-current="page"] .n{background:var(--acc);color:var(--on)}

main{padding-block:16px 40px}
.view{display:grid;gap:16px}
.view>*{min-width:0}

/* Champ d'ajout */
.add{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 5px 5px 16px;box-shadow:var(--sh-card)}
.add input{flex:1;min-width:0;border:0;background:transparent;font-size:1.05rem;padding:8px 0}
.add input:focus-visible{outline:none}
.add:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--on);padding:8px 18px;border-radius:99px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.alt{background:var(--card);color:var(--acc)}
.btn.small{padding:5px 12px;font-size:.95rem}
.btn:disabled{opacity:.5;cursor:default}
.hint{margin:0;color:var(--mute);font-size:1rem}

/* Rayons */
.rayon{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-card);overflow:hidden}
.rayon h2{margin:0;padding:8px 16px;font-size:1.15rem;display:flex;justify-content:space-between;align-items:baseline;color:var(--acc-deep)}
.rayon h2 small{font-weight:400;font-size:.9rem}
.items{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 14px;border-top:1px solid var(--line)}
.item label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.item input[type=checkbox]{appearance:none;width:26px;height:26px;border:2px solid var(--acc);border-radius:50%;flex:none;display:grid;place-items:center;cursor:pointer;background:var(--card)}
.item input[type=checkbox]:checked{background:var(--acc)}
.item input[type=checkbox]:checked::after{content:"";width:10px;height:6px;border:solid var(--on);border-width:0 0 3px 3px;transform:translateY(-2px) rotate(-45deg)}
.item .e{font-size:1.4rem;flex:none;width:1.6rem;text-align:center}
.item .txt{min-width:0}
.item b{display:block;font-size:1.1rem;line-height:1.2}
.item small{display:block;color:var(--mute);font-size:.95rem;line-height:1.25;overflow-wrap:anywhere}
.item.done b{text-decoration:line-through;color:var(--mute)}
.del{border:0;background:transparent;color:var(--mute);font-size:1.3rem;width:36px;height:36px;border-radius:50%;cursor:pointer;flex:none}
.del:hover{background:var(--acc-pale)}

.actions{display:flex;flex-wrap:wrap;gap:8px}
.empty{background:var(--veil);border-radius:18px;padding:22px 18px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:1.2rem;margin-bottom:4px}
.empty .actions{justify-content:center;margin-top:12px}

/* Recettes */
.search{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:1.05rem;box-shadow:var(--sh-card)}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rcard{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--sh-card);cursor:pointer}
.rcard b{font-size:1.05rem;line-height:1.2}
.rcard small{color:var(--mute);font-size:.95rem}
.rcard[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.panel{scroll-margin-top:150px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-card);padding:14px 16px;display:grid;gap:10px}
.panel h2{margin:0;font-size:1.4rem;color:var(--acc);line-height:1.1}
.ings{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ings label{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-radius:10px;cursor:pointer}
.ings label:hover{background:var(--acc-pale)}
.ings input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--acc);flex:none}
.tag{display:inline-block;font-size:.8rem;padding:0 8px;border-radius:99px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.have{background:var(--ok-pale);color:var(--acc-deep)}
.tag.unk{background:var(--warn);color:var(--acc-deep)}
.tag.src{background:var(--acc-pale);color:var(--acc-deep)}

/* Presque */
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-card);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pcard .txt{min-width:0;flex:1 1 220px}
.pcard b{display:block;font-size:1.1rem;line-height:1.2}
.pcard small{color:var(--mute);font-size:.95rem}
.miss{margin-top:4px;display:flex;flex-wrap:wrap;gap:6px}
.miss span{background:var(--warn);color:var(--acc-deep);border-radius:99px;padding:1px 10px;font-size:.92rem}
.note{background:var(--veil);border-radius:14px;padding:10px 14px;font-size:.95rem}
.note a{color:var(--acc);font-weight:700}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);width:min(520px,calc(100% - 32px));display:flex;align-items:center;gap:12px;background:#fff;color:#1f2a24;border:1px solid #d3e6ea;border-left:6px solid #0f6b78;border-radius:16px;padding:10px 10px 10px 12px;box-shadow:0 10px 28px rgba(15,107,120,.25);font-size:1.05rem;line-height:1.3;white-space:normal;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast::before{content:"✓";flex:none;width:28px;height:28px;border-radius:50%;background:#0f6b78;color:#fff;display:grid;place-items:center;font-weight:700;font-size:1rem}
#toast.warn{border-left-color:#e07a4f}#toast.warn::before{content:"!";background:#e07a4f}
#toast>span{flex:1;min-width:0}
#toast button{flex:none;border:1px solid #0f6b78;background:#e3f6f8;color:#0b4f59;border-radius:99px;padding:6px 14px;font:inherit;font-size:.95rem;font-weight:700;cursor:pointer;text-decoration:none}
@media (prefers-reduced-motion:reduce){#toast{transition:none;transform:translate(-50%,0)}}
</style>
</head>
<body>
<header class="hdr gut">
  <div class="wrap">
    <div class="top">
      <a class="back" href="./" aria-label="Retour à l'accueil Cookapli">←</a>
      <div style="min-width:0;flex:1"><h1>Liste de courses</h1><p id="sub">Chargement…</p></div>
      <button type="button" class="reset" id="b-reset" hidden>↺ Réinitialiser</button>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#liste" id="tab-liste">Ma liste<span class="n" id="n-liste">0</span></a>
      <a href="#recette" id="tab-recette">Recettes</a>
      <a href="#presque" id="tab-presque">Presque prêtes<span class="n" id="n-presque" hidden>0</span></a>
    </nav>
  </div>
</header>

<main class="gut">
  <div class="wrap">

    <section class="view" id="v-liste" aria-label="Ma liste">
      <form class="add" id="add-form">
        <input id="add-input" aria-label="Ajouter un article" list="ing-list" autocomplete="off" placeholder="Ajouter un article : lait, 6 œufs, lessive…">
        <button class="btn" type="submit">Ajouter</button>
      </form>
      <datalist id="ing-list"></datalist>
      <div id="groups"></div>
      <div class="actions" id="list-actions" hidden>
        <button class="btn" type="button" id="b-ranger">🧺 Ranger les articles pris dans mes réserves</button>
        <button class="btn alt" type="button" id="b-copy">Copier la liste</button>
        <button class="btn alt" type="button" id="b-clear">Retirer les articles pris</button>
      </div>
    </section>

    <section class="view" id="v-recette" aria-label="Depuis une recette" hidden>
      <input class="search" id="r-q" type="search" placeholder="Chercher dans tes recettes" aria-label="Chercher dans tes recettes">
      <p class="hint" id="r-state"></p>
      <div class="panel" id="r-panel" hidden></div>
      <div class="rlist" id="r-list"></div>
    </section>

    <section class="view" id="v-presque" aria-label="Recettes presque prêtes" hidden>
      <p class="hint">Les recettes pour lesquelles il ne te manque qu'un ou deux ingrédients, d'après tes réserves Friscan (frigo et placard).</p>
      <div id="p-note"></div>
      <div class="view" id="p-list"></div>
    </section>

  </div>
</main>

<div id="toast" role="status" aria-live="polite"><span id="toast-txt"></span><button type="button" id="toast-undo" hidden>Annuler</button></div>

<!-- Référentiel d'ingrédients partagé avec Friscan (même site) -->
<script src="../friscan/data.js?v=9"></script>
<script src="commentaire.js?v=1" data-context="Cookapli · Liste de courses" data-extra="Ta liste de courses reste sur ton téléphone." defer></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const norm = s => ' ' + String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/œ/g, 'oe').replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
const slugify = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

/* ---------- données partagées avec Friscan ---------- */
const HAS = typeof ING !== 'undefined';
const IG = HAS ? ING : {};
const GR = HAS ? GROUPS : {};
const RAYONS = Object.assign({}, GR, { autre: (GR.autre || { n: 'Autres articles', c: '#d0a9e6' }) });
const ORDER = ['legume', 'frais', 'viande', 'feculent', 'epicerie', 'sucre', 'surgele', 'autre', 'inconnu'];
const EQUIV = HAS && typeof SUBST !== 'undefined' ? SUBST : {};
const alts = id => [id, ...(EQUIV[id] || [])];
const fridge = () => { const f = store.get('friscan.fridge', []); return Array.isArray(f) ? f : []; };
const placard = () => store.get('friscan.placard', HAS && typeof PLACARD_DEFAUT !== 'undefined' ? PLACARD_DEFAUT : []);
const inFridge = id => { const f = fridge(); return alts(id).some(x => f.some(p => p.ing === x)); };
const inPlacard = id => { const p = placard(); return alts(id).some(x => p.includes(x)); };
const have = id => inPlacard(id) || inFridge(id);

/* même reconnaissance que Friscan : nom de produit -> ingrédient */
function guessIng(name) {
  const txt = norm(name);
  let best = null, bi = 1e9, bl = 0;
  for (const [id, d] of Object.entries(IG))
    for (const k of d.k) {
      const pat = ' ' + norm(k).trim() + (k.endsWith(' ') ? ' ' : '');
      const i = txt.indexOf(pat);
      if (i >= 0 && (i < bi || (i === bi && pat.length > bl))) { best = id; bi = i; bl = pat.length; }
    }
  return best;
}
const VERBES = /^(pelez|coupez|versez|ajoutez|faites|dans|baissez|epluchez|mettre|mettez|laver|lavez|couper|emincer|emincez|ajouter|verifier|portez|laissez|servez|bout|passer|remettre|blanchir|verser|melanger|melangez|prechauffer|prechauffez|faire|cuire|reserver)( |$)/;
const EAU = /^(\d+|cl|ml|l|g|gr|litre|litres|de|d|du|eau|froide|chaude|tiede|bouillante|un|une|peu|verre|verres|bol)$/;
function lineIng(t) {
  const n = norm(t).trim();
  if (!n || /inserez/.test(n)) return { skip: 1 };
  const w = n.split(' ');
  if (w.length > 16 || VERBES.test(n)) return { skip: 1 };
  if (/^moule (a|de|en) /.test(n) || /facultati|optionnel|pour servir/.test(n) || /( |^)deco(ration)?( |$)/.test(n)) return { skip: 1 };
  if (w.includes('eau') && w.every(x => EAU.test(x))) return { skip: 1 };
  return { id: guessIng(t) };
}

/* ---------- la liste ---------- */
let list = store.get('cookapli.courses', []);
if (!Array.isArray(list)) list = [];
const save = () => store.set('cookapli.courses', list);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const emojiOf = it => (it.ing && IG[it.ing] ? IG[it.ing].e : '🛒');
const rayonOf = it => (it.ing && IG[it.ing] ? IG[it.ing].g : 'autre');

/* ajoute un article ; fusionne avec le même ingrédient encore à prendre */
function addEntry({ name, ing = null, qty = '', src = '' }) {
  const same = list.find(x => !x.done && ((ing && x.ing === ing) || (!ing && !x.ing && norm(x.name) === norm(name))));
  if (same) {
    if (qty && !same.qty.includes(qty)) same.qty.push(qty);
    if (src && !same.src.includes(src)) same.src.push(src);
    return same;
  }
  const it = { id: uid(), name: ing && IG[ing] ? IG[ing].n : name, raw: name, ing, qty: qty ? [qty] : [], src: src ? [src] : [], done: false, added: Date.now() };
  list.push(it);
  return it;
}

function renderList() {
  const box = $('#groups');
  const todo = list.filter(x => !x.done).length, done = list.length - todo;
  $('#n-liste').textContent = todo;
  $('#sub').textContent = list.length ? `${todo} à prendre${done ? `, ${done} dans le panier` : ''}` : 'Ta liste est vide';
  $('#list-actions').hidden = !list.length;
  $('#b-reset').hidden = !list.length;
  $('#b-ranger').disabled = $('#b-clear').disabled = !done;
  if (!list.length) {
    box.innerHTML = `<div class="empty"><b>Rien à acheter pour l'instant</b>Ajoute un article ci-dessus, ou pioche les ingrédients d'une recette.
      <div class="actions"><a class="btn" href="#recette">Depuis une recette</a><a class="btn alt" href="#presque">Recettes presque prêtes</a></div></div>`;
    return;
  }
  const groups = {};
  for (const it of list) (groups[rayonOf(it)] ||= []).push(it);
  const keys = [...ORDER.filter(k => groups[k]), ...Object.keys(groups).filter(k => !ORDER.includes(k))];
  box.innerHTML = keys.map(k => {
    const r = RAYONS[k] || RAYONS.autre, items = groups[k].sort((a, b) => a.done - b.done || a.name.localeCompare(b.name, 'fr'));
    const left = items.filter(x => !x.done).length;
    return `<section class="rayon" style="border-top:6px solid ${r.c}">
      <h2 style="background:${r.c}33">${esc(r.n)}<small>${left ? left + ' à prendre' : 'tout est pris'}</small></h2>
      <ul class="items">${items.map(it => {
        const det = [it.qty.filter(q => norm(q) !== norm(it.name)).join(' + '), it.src.length ? 'pour ' + it.src.join(', ') : '', it.raw && it.raw !== it.name && !it.qty.length ? it.raw : ''].filter(Boolean).join(' · ');
        return `<li class="item${it.done ? ' done' : ''}">
          <label><input type="checkbox" data-id="${it.id}" ${it.done ? 'checked' : ''} aria-label="${esc(it.name)} pris"><span class="e" aria-hidden="true">${emojiOf(it)}</span>
          <span class="txt"><b>${esc(it.name)}</b>${det ? `<small>${esc(det)}</small>` : ''}</span></label>
          <button class="del" type="button" data-del="${it.id}" aria-label="Retirer ${esc(it.name)}">×</button></li>`;
      }).join('')}</ul></section>`;
  }).join('');
}

$('#groups').addEventListener('change', e => {
  const id = e.target.dataset.id; if (!id) return;
  const it = list.find(x => x.id === id); if (!it) return;
  it.done = e.target.checked; save(); renderList();
});
$('#groups').addEventListener('click', e => {
  const id = e.target.dataset.del; if (!id) return;
  const i = list.findIndex(x => x.id === id); if (i < 0) return;
  const [it] = list.splice(i, 1); save(); renderList();
  toast(`${it.name} retiré`, () => { list.splice(i, 0, it); save(); renderList(); });
});
$('#add-form').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#add-input').value.trim(); if (!v) return;
  const id = guessIng(v);
  /* « 6 œufs », « 1 kg de pommes » : on garde la quantité tapée */
  const qty = /^\s*[\d½¼¾]/.test(v) && id ? v : '';
  const it = addEntry({ name: v, ing: id, qty });
  save(); renderList(); $('#add-input').value = '';
  const warn = id && have(id) ? ` (tu en as déjà${inPlacard(id) ? ' dans le placard' : ' au frigo'})` : '';
  toast(`${it.name} ajouté${warn}`);
});

/* tout effacer d'un coup (récupérable avec « Annuler » pendant quelques secondes) */
$('#b-reset').onclick = () => {
  if (!list.length) return;
  const before = list.slice(), n = before.length;
  list = []; save(); renderList();
  toast(`Liste réinitialisée (${pl(n, 'article retiré', 'articles retirés')})`, () => { list = before; save(); renderList(); });
};
$('#b-clear').onclick = () => {
  const before = list.slice(); list = list.filter(x => !x.done); save(); renderList();
  toast(`${pl(before.length - list.length, 'article retiré', 'articles retirés')}`, () => { list = before; save(); renderList(); });
};
$('#b-ranger').onclick = () => {
  const taken = list.filter(x => x.done); if (!taken.length) return;
  const f = fridge(), beforeF = f.slice(), beforeL = list.slice();
  for (const it of taken) f.unshift({ uid: uid(), name: it.ing ? IG[it.ing].n : it.name, ing: it.ing || null, other: !it.ing, added: Date.now() });
  store.set('friscan.fridge', f);
  list = list.filter(x => !x.done); save(); renderList(); renderPresque();
  toast(`${pl(taken.length, 'article rangé', 'articles rangés')} dans tes réserves Friscan`, () => { store.set('friscan.fridge', beforeF); list = beforeL; save(); renderList(); renderPresque(); });
};
$('#b-copy').onclick = async () => {
  const groups = {};
  for (const it of list.filter(x => !x.done)) (groups[rayonOf(it)] ||= []).push(it);
  const txt = 'Liste de courses (Cookapli)\n' + ORDER.filter(k => groups[k]).map(k => `\n${(RAYONS[k] || RAYONS.autre).n}\n` + groups[k].map(it => `- ${it.name}${it.qty.length ? ' (' + it.qty.join(' + ') + ')' : ''}`).join('\n')).join('\n');
  try { await navigator.clipboard.writeText(txt); toast('Liste copiée, colle-la où tu veux'); }
  catch (e) { toast('Copie impossible sur cet appareil'); }
};

/* ---------- recettes : Mes recettes (feuille + fiches) et recettes Friscan ---------- */
const SRC = HAS && typeof MES_RECETTES !== 'undefined' ? MES_RECETTES : null;
let mine = [];     /* { n, cat, slug, lines:[{t,id}] } */
let rState = '';
function csvRows(t) {
  const rows = []; let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { r.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; r.push(f); f = ''; rows.push(r); r = []; }
    else f += c;
  }
  if (f !== '' || r.length) { r.push(f); rows.push(r); }
  return rows;
}
function buildMine(csvT, fiches) {
  const out = []; let cur = '';
  for (const row of csvRows(csvT).slice(5)) {
    const name = (row[2] || '').trim(); if (!name) continue;
    cur = (row[1] || '').trim() || cur;
    const slug = slugify(name), fi = fiches[slug];
    if (!fi || !fi.ing) continue;
    const lines = [];
    for (const l of fi.ing) { if (l.l) continue; const r = lineIng(l.t || ''); if (!r.skip) lines.push({ t: l.t, id: r.id || null }); }
    if (lines.length) out.push({ n: name, cat: cur, slug, pers: (fi.m && fi.m.pers) || '', lines });
  }
  return out;
}
async function loadMine() {
  const cache = store.get('cookapli.recettes', null);
  if (cache && cache.list && cache.list.length) mine = cache.list;
  if (cache && Date.now() - cache.t < 6 * 3600e3) return;
  if (!SRC || !SRC.csv) { rState = mine.length ? '' : 'Tes recettes ne sont pas accessibles depuis cette page.'; return; }
  rState = mine.length ? '' : 'Chargement de tes recettes…'; renderRecettes();
  try {
    const [csvT, fj] = await Promise.all([
      fetch(SRC.csv + '&t=' + Date.now()).then(r => { if (!r.ok) throw 0; return r.text(); }),
      fetch(SRC.fiches + '?all=1').then(r => { if (!r.ok) throw 0; return r.json(); })
    ]);
    const out = buildMine(csvT, (fj && fj.fiches) || {});
    if (!out.length) throw 0;
    mine = out; rState = ''; store.set('cookapli.recettes', { list: out, t: Date.now() });
  } catch (e) {
    rState = mine.length ? 'Hors connexion : dernière version enregistrée de tes recettes.' : 'Tes recettes n’ont pas pu être chargées. Vérifie ta connexion puis recharge la page.';
  }
  renderRecettes(); renderPresque();
}

let picked = null;
function renderRecettes() {
  $('#r-state').textContent = rState || (mine.length ? `${mine.length} recettes. Choisis-en une pour ajouter ce qui te manque.` : '');
  const q = norm($('#r-q').value).trim();
  const items = mine.filter(r => !q || norm(r.n + ' ' + r.cat).includes(q));
  $('#r-list').innerHTML = items.map(r => `<button type="button" class="rcard" data-slug="${esc(r.slug)}" aria-pressed="${picked === r.slug}"><b>${esc(r.n)}</b><small>${esc(r.cat)} · ${r.lines.length} ingrédients</small></button>`).join('')
    || (mine.length ? '<p class="hint">Aucune recette ne correspond.</p>' : '');
  const r = mine.find(x => x.slug === picked), p = $('#r-panel');
  if (!r) { p.hidden = true; return; }
  p.hidden = false;
  p.innerHTML = `<h2>${esc(r.n)}</h2>
    <p class="hint">Coché : ce qui part dans ta liste. Ce que tu as déjà dans Friscan est décoché.${r.pers ? ` Quantités pour ${esc(r.pers)} personne${r.pers > 1 ? 's' : ''}, comme sur la fiche.` : ''}</p>
    <ul class="ings">${r.lines.map((l, i) => {
      const h = l.id && have(l.id);
      return `<li><label><input type="checkbox" data-i="${i}" ${h ? '' : 'checked'}><span>${esc(l.t)}${h ? `<span class="tag have">${inPlacard(l.id) ? 'dans le placard' : 'au frigo'}</span>` : ''}${!l.id ? '<span class="tag unk">non reconnu</span>' : ''}</span></label></li>`;
    }).join('')}</ul>
    <div class="actions"><button class="btn" type="button" id="r-add">Ajouter à ma liste</button>
    <a class="btn alt" href="../recettes/#${esc(r.slug)}">Voir la recette</a></div>`;
  const upd = () => { const n = p.querySelectorAll('.ings input:checked').length; $('#r-add').textContent = n ? `Ajouter ${n} ingrédient${n > 1 ? 's' : ''}` : 'Rien à ajouter'; $('#r-add').disabled = !n; };
  p.querySelector('.ings').addEventListener('change', upd); upd();
  $('#r-add').onclick = () => {
    let n = 0;
    p.querySelectorAll('.ings input:checked').forEach(c => { const l = r.lines[+c.dataset.i]; addEntry({ name: l.t, ing: l.id, qty: l.t, src: r.n }); n++; });
    save(); renderList(); picked = null; renderRecettes();
    toast(`${n} ingrédient${n > 1 ? 's' : ''} de « ${r.n} » ajouté${n > 1 ? 's' : ''}`);
  };
}
$('#r-list').addEventListener('click', e => {
  const b = e.target.closest('.rcard'); if (!b) return;
  picked = picked === b.dataset.slug ? null : b.dataset.slug; renderRecettes();
  if (picked) $('#r-panel').scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
});
$('#r-q').addEventListener('input', renderRecettes);

/* ---------- presque prêtes (même règle que Friscan : 1 ou 2 manquants) ---------- */
function allRecipes() {
  const a = mine.map(r => ({ n: r.n, sub: r.cat, mineSlug: r.slug, ings: [...new Set(r.lines.filter(l => l.id).map(l => l.id))], qty: id => (r.lines.find(l => l.id === id) || {}).t || '' }));
  const b = HAS && typeof RECETTES !== 'undefined' ? RECETTES.map(r => ({ n: r.n, sub: 'Recette rapide Friscan · ' + r.min + ' min', ings: r.ing.filter(x => !x[2]).map(x => x[0]), qty: id => { const x = r.ing.find(y => y[0] === id); return x && x[1] ? x[1] : ''; } })) : [];
  return [...a, ...b];
}
function renderPresque() {
  const f = fridge();
  const note = $('#p-note');
  if (!HAS) { note.innerHTML = '<p class="note">Les données de Friscan ne sont pas disponibles sur cette page.</p>'; $('#p-list').innerHTML = ''; return; }
  note.innerHTML = f.length ? '' : `<p class="note">Tes réserves Friscan sont vides sur cet appareil. Le calcul se base seulement sur ton placard. <a href="../friscan/#scan">Scanner mon frigo</a></p>`;
  const res = allRecipes().map(r => ({ r, miss: r.ings.filter(id => !have(id)), used: r.ings.filter(inFridge).length }))
    .filter(x => x.miss.length >= 1 && x.miss.length <= 2 && x.r.ings.length >= 3)
    .sort((a, b) => a.miss.length - b.miss.length || b.used - a.used || a.r.n.localeCompare(b.r.n, 'fr'))
    .slice(0, 40);
  const nb = $('#n-presque'); nb.hidden = !res.length; nb.textContent = res.length;
  $('#p-list').innerHTML = res.map((x, i) => `<div class="pcard"><div class="txt"><b>${esc(x.r.n)}</b><small>${esc(x.r.sub)}${x.used ? ` · utilise ${x.used} produit${x.used > 1 ? 's' : ''} de tes réserves` : ''}</small>
      <div class="miss">${x.miss.map(id => `<span>${IG[id].e} ${esc(IG[id].n)}</span>`).join('')}</div></div>
      <button class="btn small" type="button" data-p="${i}">🛒 Ajouter ${x.miss.length > 1 ? 'les 2 manquants' : 'le manquant'} à ma liste</button></div>`).join('')
    || '<div class="empty"><b>Aucune recette à 1 ou 2 ingrédients près</b>Scanne ou ajoute des produits dans Friscan, la liste se mettra à jour.</div>';
  $('#p-list').onclick = e => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    const x = res[+b.dataset.p];
    x.miss.forEach(id => addEntry({ name: IG[id].n, ing: id, qty: x.r.qty(id), src: x.r.n }));
    save(); renderList(); b.disabled = true; b.textContent = '✓ Ajouté à ta liste de courses';
    toast(`${x.miss.map(id => IG[id].n).join(' et ')} ajouté${x.miss.length > 1 ? 's' : ''} pour « ${x.r.n} »`);
  };
}

/* ---------- navigation ---------- */
const VIEWS = ['liste', 'recette', 'presque'];
function route() {
  let v = location.hash.slice(1); if (!VIEWS.includes(v)) v = 'liste';
  VIEWS.forEach(k => { $('#v-' + k).hidden = k !== v; const t = $('#tab-' + k); if (k === v) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  if (v === 'recette') renderRecettes();
  if (v === 'presque') renderPresque();
}
window.addEventListener('hashchange', route);
/* un autre onglet (Friscan) modifie le frigo : on recalcule */
window.addEventListener('storage', e => { if (e.key === 'friscan.fridge' || e.key === 'friscan.placard') { renderPresque(); renderRecettes(); } if (e.key === 'cookapli.courses') { list = store.get('cookapli.courses', []); renderList(); } });

/* ---------- toast ---------- */
const pl = (n, one, many) => `${n} ${n > 1 ? many : one}`;

let tT, undoFn;
function toast(msg, undo) {
  $('#toast-txt').textContent = msg; undoFn = undo; $('#toast-undo').hidden = !undo; $('#toast').classList.toggle('warn', /impossible|refus|indisponible|échou|Ajoute au moins/i.test(msg));
  $('#toast').classList.add('on'); clearTimeout(tT); tT = setTimeout(() => $('#toast').classList.remove('on'), undo ? 5000 : 2600);
}
$('#toast-undo').onclick = () => { if (undoFn) undoFn(); undoFn = null; $('#toast').classList.remove('on'); };

/* ---------- démarrage ---------- */
$('#ing-list').innerHTML = Object.values(IG).map(d => `<option value="${esc(d.n)}"></option>`).join('');
renderList(); route(); loadMine();
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){})}</script>
</body>
