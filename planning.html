<style>
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef8fb;--wash1:#f1fafc;--wash2:#e6f6f7;--wash3:#eaf5fb;--card:#fff;--line:#d3e6ea;--ink:#1f2a24;
  --acc:#0f6b78;--acc-deep:#0b4f59;--acc-pale:#e3f6f8;--on:#fff;--sh-card:0 2px 8px rgba(0,0,0,.1);--sh-header:0 2px 10px rgba(0,0,0,.15);
  --midi:#fff1c9;--midi-b:#e9b949;--midi-t:#6b4a00;--soir:#e4e2fb;--soir-b:#8f86e0;--soir-t:#352d86;
  --font:Nunito,"Segoe UI",Arial,sans-serif;color-scheme:light;
}
html{font-size:14px}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);font:1rem/1.45 var(--font);background:linear-gradient(160deg,var(--wash1),var(--wash2) 55%,var(--wash3)) fixed,var(--bg);min-height:100vh}

p{margin:0}

.slot .chev{flex:none;color:var(--acc);font-weight:800;font-size:.9rem;display:flex;align-items:center;gap:4px}
.slot.vide .ph{background:#f0f6f7;border:2px dashed #9cc3c9;color:var(--acc);font-size:1.5rem}
.slot.vide .tx b{color:var(--acc);font-weight:800}

.iamini{position:absolute;right:3px;bottom:3px;font-weight:700;font-size:.55rem;line-height:1;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;padding:2px 4px;white-space:nowrap}

.cur{background:#f6fbfc;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:8px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:99px;padding:6px 14px;font:inherit;font-weight:800;font-size:.95rem;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--acc);color:#fff}
.res{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.res button{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 10px;font:inherit;text-align:left;cursor:pointer;color:var(--ink);min-height:64px}

.res .ph img{width:100%;height:100%;object-fit:cover;display:block}
.res .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.res .tx b{font-weight:800;line-height:1.2}
.res .tx small{font-size:.85rem;font-weight:700;color:#000}
.sec{margin:4px 0 0;font-size:1rem;font-weight:800;color:var(--acc-deep)}
.vide{text-align:center;color:#000;font-weight:700;padding:14px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);width:min(520px,calc(100% - 32px));display:flex;align-items:center;gap:12px;background:#fff;color:#1f2a24;border:1px solid #d3e6ea;border-left:6px solid #0f6b78;border-radius:16px;padding:12px 14px;box-shadow:0 10px 24px rgba(0,0,0,.18);font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast::before{content:"✓";flex:none;width:28px;height:28px;border-radius:50%;background:#0f6b78;color:#fff;display:grid;place-items:center;font-weight:700}
#toast span{flex:1}
#toast button{flex:none;border:1px solid #0f6b78;background:#e3f6f8;color:#0b4f59;border-radius:99px;padding:6px 14px;font:inherit;font-size:.95rem;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:380px){.repas{grid-template-columns:62px 1fr}.slot .ph{width:46px;height:46px}}
</style>
</head>
<body>
<header class="hdr gut">
  <div class="wrap">
    <a class="back" href="./">← Cookapli</a>
    <h1>Planificateur semaine</h1>
    <p>Tes repas du lundi au dimanche, midi et soir</p>
  </div>
</header>
<main class="gut"><div class="wrap stack">
  <div class="card stack">
    <p class="lead">Pour chaque repas, ajoute une entrée, un plat et un dessert : une recette Cookapli ou ton propre plat. Touche une recette pour l’ouvrir, «&nbsp;Modifier&nbsp;» pour la changer.</p>
    <p class="note" id="filtres" hidden></p>
    <div class="top"><span class="compte" id="compte"></span><button type="button" class="btn danger small" id="vider">Vider la semaine</button></div>
  </div>
  <div id="semaine" class="stack" aria-live="polite"></div>
  <p style="text-align:center;color:#5d7478;font-size:.8rem;margin-top:10px">Planificateur semaine · version 3</p>
</div></main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="box">
    <div class="sh">
      <div class="t"><h3 id="shT"></h3><button type="button" class="x" id="shX" aria-label="Fermer">✕</button></div>
      <label class="champ"><span aria-hidden="true">🔍</span><input id="q" type="search" autocomplete="off" enterkeyhint="done" placeholder="Cherche une recette ou écris ton plat" aria-label="Chercher une recette ou écrire le nom de ton plat"></label>
      <div class="chips" id="cats" role="group" aria-label="Type de plat"></div>
    </div>
    <div class="sb" id="sb"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"><span></span></div>

<script src="../friscan/data.js?v=24"></script>
<script src="budget.js?v=3"></script>
<script src="filtres.js?v=3"></script>
<script src="accueil.js?v=15"></script>
<script src="saison.js?v=2"></script>
<script src="../recettes/calories.js?v=9"></script>
<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};

function norm(x){return String(x||"").replace(/œ/gi,"oe").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()}

function lireCsv(t){LIVRE=[];var cur="";rows(t||"").slice(5).forEach(function(r){var n=(r[2]||"").trim();cur=(r[1]||"").trim()||cur;if(!n)return;var im="",ia="";
  for(var k=5;k<r.length;k++){var cx=(r[k]||"").trim();if(!im&&/\.(jpe?g|png|webp|gif)$/i.test(cx))im=cx;if(/^(rl\s*\/\s*ia|ia)$/i.test(cx))ia=1}
  var g=groupe(cur);if(!g)return;var ty=(r[3]||"").trim(),all=slug(cur)+"-"+slug(ty)+"-"+slug(n);
  LIVRE.push({k:"l",id:slug(n),n:n,cat:/^plat(-|$)/.test(slug(cur))?"Plat":cur,g:g,t:ty,img:im?"../recettes/"+encodeURI(im):"",ia:ia,vg:/(^|-)vegan(-|$)/.test(slug(ty)+"-"+slug(n))?2:/vegetarien|vegan|(^|-)vege(-|$)/.test(all)?1:0,url:"../recettes/#"+slug(n)})})}
if(CSV)lireCsv(CSV);
function dureeMin(v){var n=norm(v).replace(/[^a-z0-9+]+/g," ").trim();if(!n||/^(sans cuisson|0( min| mn)?)$/.test(n))return 0;var tot=0,ok=false;String(v).split("+").forEach(function(p){p=norm(p).replace(/(\d+) ?(?:a|à|ou) ?(\d+)/g,"$2");var m=p.match(/(\d+) ?h(?:eures?)?(?: ?(\d+))?/);if(m){tot+=m[1]*60+(+m[2]||0);ok=true;return}m=p.match(/(\d+)/);if(m){tot+=+m[1];ok=true}});return ok?tot:null}
function infosLivre(r){var f=FICHES[r.id];r.f=f;r.min=null;r.kc=0;if(f&&f.m){var a=dureeMin(f.m.prep),b=dureeMin(f.m.cuisson);if(a!=null&&b!=null)r.min=a+b}
  if(f&&window.CookCalc)try{r.kc=CookCalc.kcal(f)||0}catch(e){}return r}

function guess(t){if(!HAS)return null;var txt=nrm(t),best=null,bi=1e9,bl=0;Object.keys(ING).forEach(function(id){ING[id].k.forEach(function(k){var pat=" "+nrm(k).trim()+(k.slice(-1)===" "?" ":"");var i=txt.indexOf(pat);if(i>=0&&(i<bi||(i===bi&&pat.length>bl))){best=id;bi=i;bl=pat.length}})});return best}
function prixPret(){return!!(window.CookBudget&&CookBudget.pret())}
function budgetDe(x){try{if(!prixPret())return null;if(x.k==="l")return x.f&&window.CookCalc?CookCalc.budget(x.f,guess):null;return CookBudget.recetteFriscan(x.src,ING)}catch(e){return null}}
var PETIT_BUDGET=!!(prof&&prof.profil==="antigaspi");
var EQUILIBRE=!!(prof&&prof.profil==="equilibre");
function okLivre(r){if(DEBUTANT&&r.f&&r.f.m&&/difficile/i.test(r.f.m.diff||""))return false;if(!FA.length)return true;if(!window.CookFiltres)return true;return CookFiltres.okTexte(r.f?CookFiltres.texteFiche(r.n,r.f,r.t):null,FA)}

  return{k:"r",id:r.id,n:r.n,cat:r.cat,g:g,e:r.e,img:r.img?"../friscan/"+r.img:"",ia:r.ia?1:0,vg:/v[ée]g[ée]tarien/i.test(r.cat)?1:0,min:r.min,kc:kc,url:"../friscan/#r-"+r.id,src:r}});

  T.forEach(function(x){x.bu=budgetDe(x);x.pp=x.bu&&x.bu.pp?x.bu.pp:Infinity});
  /* profil « Petit budget » : de la moins chère à la plus chère */
  T.sort(PETIT_BUDGET?function(a,b){return a.pp-b.pp||a.n.localeCompare(b.n,"fr")}:EQUILIBRE?function(a,b){return (a.kc||Infinity)-(b.kc||Infinity)||a.n.localeCompare(b.n,"fr")}:function(a,b){return a.n.localeCompare(b.n,"fr")});
  /* recettes de saison d'abord (l'ordre ci-dessus est gardé dans chaque groupe) */
  if(window.CookSaison){T.forEach(function(x){x.sais=CookSaison.ok(x.k==="r"?CookSaison.texteRapide(x.src,ING):CookSaison.texteFiche(x.n,x.f))});T=T.filter(function(x){return x.sais}).concat(T.filter(function(x){return !x.sais}))}
  return T}
function trouver(v){if(!v||v.k==="p")return null;var L=v.k==="l"?LIVRE:RAPIDES;for(var i=0;i<L.length;i++)if(L[i].id===v.id)return L[i];return null}

/* ---------- affichage de la semaine ---------- */
var auj=(new Date().getDay()+6)%7;
function vignette(x,emo){var h='<span class="ph" aria-hidden="true">';if(x&&x.img)h+='<img src="'+esc(x.img)+'" alt="" loading="lazy" onerror="this.remove()">'+(x.ia?'<span class="iamini">image IA?</span>':"");else h+=emo||(x&&x.e)||"🍽️";return h+"</span>"}
function tagsDe(v,x){if(v.k==="p")return'<span class="tag perso">✏️ Plat perso</span>';var t=v.k==="l"?'<span class="tag livre">📖 Livre de recettes</span>':'<span class="tag rapide">⏱️ Recette rapide</span>';
  if(x&&x.vg)t+=' <span class="tag vg'+(x.vg===2?" vegan":"")+'">'+(x.vg===2?"Vegan":"Végétarien")+"</span>";return'<span style="display:flex;flex-wrap:wrap;gap:4px">'+t+"</span>"}
function dessiner(){var box=$("semaine"),h="",n=0;
  JOURS.forEach(function(j,d){h+='<section class="card jour'+(d===auj?" auj":"")+'" aria-label="'+j+'"><h2>'+j+(d===auj?'<span class="auj">Aujourd’hui</span>':"")+"</h2>";
    REPAS.forEach(function(R){if(!repasVide(d,R[0]))n++;var ajouts="";
      h+='<div class="repas '+R[0]+'"><div class="lab"><span aria-hidden="true">'+R[1]+"</span>"+R[2]+'</div><div class="items">';
      PLATS.forEach(function(C){var v=slotDe(d,R[0],C[0]);
        if(!v){ajouts+='<button type="button" class="ajout'+(C[0]==="p"?" pl":"")+'" data-d="'+d+'" data-m="'+R[0]+'" data-c="'+C[0]+'">+ Ajouter '+C[2]+"</button>";return}
        var x=trouver(v),dm=' data-d="'+d+'" data-m="'+R[0]+'" data-c="'+C[0]+'"',lib=j+" "+R[2].toLowerCase()+", "+C[1].toLowerCase()+" : "+esc(v.n);
        /* recette Cookapli : on touche le plat pour ouvrir la recette ; « Modifier » à droite pour en choisir une autre */
        if(x)h+='<div class="slot rec"><a class="go" href="'+esc(x.url)+'" aria-label="'+lib+', voir la recette">'+vignette(x)+'<span class="tx"><span class="crs">'+C[1]+"</span><b>"+esc(v.n)+"</b>"+tagsDe(v,x)+'<span class="voir">📖 Voir la recette ›</span></span></a><button type="button" class="mod"'+dm+' aria-label="'+lib+', modifier">✏️<span>Modifier</span></button></div>';
        else h+='<button type="button" class="slot"'+dm+' aria-label="'+lib+', modifier">'+vignette(x,v.k==="p"?"✏️":null)+'<span class="tx"><span class="crs">'+C[1]+"</span><b>"+esc(v.n)+"</b>"+tagsDe(v,x)+'</span><span class="mod">✏️<span>Modifier</span></span></button>'});
      h+=(ajouts?'<div class="ajouts">'+ajouts+"</div>":"")+"</div></div>"});
    h+="</section>"});
  box.innerHTML=h;$("compte").textContent=n+" repas planifié"+(n>1?"s":"")+" sur 14";$("vider").hidden=!n}
$("semaine").addEventListener("click",function(e){var b=e.target.closest("button.slot,.ajout,.mod");if(b)ouvrir(+b.dataset.d,b.dataset.m,b.dataset.c)});
$("vider").onclick=function(){var avant=JSON.stringify(P);P={v:1,j:{}};sauver();dessiner();toast("La semaine est vidée",function(){P=JSON.parse(avant);sauver();dessiner()})};

/* ---------- fenêtre de choix d'un plat ---------- */
var CATS=[["plat","Plats"],["entree","Entrées"],["accomp","Accompagnements"],["dessert","Desserts"],["tout","Tout"]];
var cur=null,catSel="plat",LISTE=[];
$("cats").innerHTML=CATS.map(function(c){return'<button type="button" class="chip" data-c="'+c[0]+'">'+c[1]+"</button>"}).join("");
$("cats").addEventListener("click",function(e){var b=e.target.closest("[data-c]");if(!b)return;catSel=b.dataset.c;resultats()});
function ouvrir(d,m,c){cur={d:d,m:m,c:c};LISTE=toutes();catSel=nomPlat(c)[3];$("q").value="";
  $("shT").textContent=JOURS[d]+" · "+(m==="midi"?"Midi":"Soir")+" · "+nomPlat(c)[1];$("sheet").hidden=false;document.body.classList.add("sheet-on");resultats();
  setTimeout(function(){if(!slotDe(d,m,c))$("q").focus();else $("shX").focus()},60)}
function fermer(){$("sheet").hidden=true;document.body.classList.remove("sheet-on");var b=cur&&document.querySelector('[data-d="'+cur.d+'"][data-m="'+cur.m+'"][data-c="'+cur.c+'"]');cur=null;if(b)b.focus()}
$("shX").onclick=fermer;
$("sheet").addEventListener("click",function(e){if(e.target===$("sheet"))fermer()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("sheet").hidden)fermer()});
$("q").addEventListener("input",resultats);
$("q").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();var t=$("q").value.trim();if(t)choisirPerso(t)}});
function mots(t){return norm(t).split(/[^a-z0-9]+/).filter(function(w){return w.length>=4&&!/^(avec|pour|sans|sauce|maison|facon|leur|dans)$/.test(w)})}
function ligne(x,v){var on=v&&v.k===x.k&&v.id===x.id,inf=[];if(x.min)inf.push("⏱️ "+x.min+" min");if(x.kc)inf.push("≈ "+x.kc+" kcal");if(x.bu&&x.bu.niv)inf.push(x.bu.niv.s+" "+x.bu.niv.t.toLowerCase());inf.push(x.k==="l"?"📖 "+x.cat:"⏱️ Recette rapide");
  return'<li><button type="button" data-k="'+x.k+'" data-id="'+esc(x.id)+'"'+(on?' aria-current="true"':"")+">"+vignette(x)+'<span class="tx"><b>'+esc(x.n)+(on?" ✓":"")+"</b>"+(x.sais?" "+CookSaison.BADGE:"")+"<small>"+esc(inf.join(" · "))+"</small></span></button></li>"}
function resultats(){if(!cur)return;var v=slotDe(cur.d,cur.m,cur.c),q=$("q").value.trim(),nq=norm(q),h="";
  [].forEach.call($("cats").children,function(b){b.setAttribute("aria-pressed",String(b.dataset.c===catSel))});
  if(v){var x=trouver(v);h+='<div class="cur"><span class="note">Actuellement :</span><b>'+esc(v.n)+"</b>"+(v.k==="p"?'<span class="note">C’est ton plat perso. Tu peux le garder, le renommer en écrivant un autre nom ci-dessus, ou le remplacer par une recette Cookapli ci-dessous.</span>':"")+
    '<div class="acts">'+(x?'<a class="btn alt small" href="'+esc(x.url)+'">Voir la recette</a>':"")+'<button type="button" class="btn danger small" id="retirer">Retirer ce plat</button></div></div>'}
  if(q)h+='<button type="button" class="perso-btn" id="perso"><span aria-hidden="true" style="font-size:1.4rem">✏️</span><span>Ajouter « '+esc(q)+" » comme plat perso</span></button>";
  else if(!v)h+='<p class="note">Pas dans Cookapli ? Écris son nom dans le champ ci-dessus.</p>';
  var L=LISTE.filter(function(x){return(catSel==="tout"||x.g===catSel)&&(!nq||norm(x.n+" "+x.cat).indexOf(nq)>=0)});
  /* plat perso : recettes Cookapli proches de son nom, pour le remplacer facilement */
  if(v&&v.k==="p"&&!q){var W=mots(v.n),pr=W.length?LISTE.filter(function(x){var n=norm(x.n);return W.some(function(w){return n.indexOf(w)>=0})}).slice(0,6):[];
    if(pr.length)h+='<p class="sec">Recettes Cookapli proches de « '+esc(v.n)+" »</p><ul class=\"res\">"+pr.map(function(x){return ligne(x,v)}).join("")+"</ul>"}
  h+='<p class="sec">'+(q?"Recettes Cookapli":"Recettes Cookapli · "+CATS.filter(function(c){return c[0]===catSel})[0][1])+(L.length?" ("+L.length+")":"")+"</p>"+(PETIT_BUDGET&&L.length?'<p class="note">💶 Petit budget : de la moins chère à la plus chère</p>':EQUILIBRE&&L.length?'<p class="note">⚖️ De saison d’abord, puis de la moins à la plus calorique</p>':"");
  h+=L.length?'<ul class="res">'+L.slice(0,80).map(function(x){return ligne(x,v)}).join("")+"</ul>":'<p class="vide">'+(LISTE.length?"Aucune recette Cookapli ne correspond."+(q?" Ajoute-le comme plat perso.":""):"Chargement des recettes…")+"</p>";
  $("sb").innerHTML=h;$("sb").scrollTop=0}
$("sb").addEventListener("click",function(e){if(!cur)return;
  if(e.target.closest("#perso")){choisirPerso($("q").value.trim());return}
  if(e.target.closest("#retirer")){var d=cur.d,m=cur.m,c=cur.c,avant=slotDe(d,m,c);poser(d,m,c,null);dessiner();fermer();toast(nomPlat(c)[1]+" retiré"+(c==="e"?"e":""),function(){poser(d,m,c,avant);dessiner()});return}
  var b=e.target.closest("[data-k]");if(!b)return;var L=b.dataset.k==="l"?LIVRE:RAPIDES,x=L.filter(function(y){return y.id===b.dataset.id})[0];if(!x)return;
  enregistrer({k:x.k,id:x.id,n:x.n})});
function choisirPerso(t){if(!t)return;enregistrer({k:"p",n:t.slice(0,80)})}
function enregistrer(v){var d=cur.d,m=cur.m,c=cur.c,avant=slotDe(d,m,c);poser(d,m,c,v);dessiner();fermer();
  toast(JOURS[d]+" "+(m==="midi"?"midi":"soir")+" · "+nomPlat(c)[1].toLowerCase()+" : "+v.n,function(){poser(d,m,c,avant);dessiner()})}

dessiner();
/* Livre de recettes et fiches à jour (même cache que le Livre) */
if(M)Promise.all([M.csv?fetch(M.csv+"&t="+Date.now()).then(function(r){return r.ok?r.text():null}).catch(function(){return null}):null,
  M.fiches?fetch(M.fiches+"?all=1").then(function(r){return r.ok?r.json():null}).catch(function(){return null}):null]).then(function(res){
  if(res[0]){lireCsv(res[0]);try{localStorage.setItem("recettes-csv",res[0])}catch(e){}}
  if(res[1]&&res[1].fiches){FICHES=res[1].fiches;lsSet("recettes-fiches",{f:FICHES,t:Date.now()})}
  dessiner();if(cur){LISTE=toutes();resultats()}});
if(window.CookBudget&&CookBudget.charger)CookBudget.charger().then(function(){if(cur){LISTE=toutes();resultats()}});
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){})}</script>
